name: Version Patch Workflow

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
        - rc
      rc_number:
        description: 'RC number (only for rc bump)'
        required: false
        default: '0'

permissions:
  contents: write
  pull-requests: write

jobs:
  version-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "Spyre-Operator"
        git config user.email "spyre-operator@users.noreply.github.com"

    - name: Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(cat VERSION)
        echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
        echo "Current version: ${CURRENT_VERSION}"

    - name: Increment version (RC)
      if: github.event.inputs.version_bump == 'rc'
      run: |
        chmod +x hack/increment-version.bash
        bash hack/increment-version.bash --rc ${{ github.event.inputs.rc_number }}

    - name: Increment version (Major/Minor/Patch)
      if: github.event.inputs.version_bump != 'rc'
      run: |
        chmod +x hack/increment-version.bash
        bash hack/increment-version.bash --${{ github.event.inputs.version_bump }}

    - name: Get new version
      id: increment_version
      run: |
        NEW_VERSION=$(cat VERSION)
        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "New version: ${NEW_VERSION}"

    - name: Create version patch branch
      id: create_branch
      run: |
        BRANCH_NAME="version-patch/v${{ steps.increment_version.outputs.new_version }}"
        echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
        git checkout -b ${BRANCH_NAME}
        git add VERSION
        git commit -m "chore: bump version to ${{ steps.increment_version.outputs.new_version }}"
        git push origin ${BRANCH_NAME}

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ steps.create_branch.outputs.branch_name }}
        base: main
        title: "chore: bump version to v${{ steps.increment_version.outputs.new_version
          }}"
        body: |
          ## Version Patch v${{ steps.increment_version.outputs.new_version }}

          This PR bumps the version from `${{ steps.current_version.outputs.version }}` to `${{ steps.increment_version.outputs.new_version }}`.

          ### Changes
          - Updated VERSION file to ${{ steps.increment_version.outputs.new_version }}

          ---
          *This PR was automatically created by the Version Patch Workflow*
        labels: |
          chore
        assignees: Spyre-Operator
        committer: Spyre-Operator <spyre-operator@users.noreply.github.com>
        author: Spyre-Operator <spyre-operator@users.noreply.github.com>

    - name: Summary
      run: |
        echo "## Version Patch Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version**: ${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version**: ${{ steps.increment_version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Version Bump Type**: ${{ github.event.inputs.version_bump }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ steps.create_branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "A pull request has been created to merge the version bump into main." >> $GITHUB_STEP_SUMMARY
